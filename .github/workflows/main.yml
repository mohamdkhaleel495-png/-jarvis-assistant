name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android Scaffold and Fix Namespace
        run: |
          flutter create . --org com.example --project-name jarvis --platforms android
          # Explicitly inject namespace directly inside android { } block
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          if "namespace" not in content:
              content = content.replace("android {", "android {\n    namespace \"com.example.jarvis\"", 1)
              with open(path, "w") as f:
                  f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
